[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-simultaneous-interpretation-assistant"
version = "0.1.0"
description = "A real-time AI simultaneous interpretation assistant with corrective subtitles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "deep-translator>=1.11.4",
  "faster-whisper>=1.2.1",
  "numpy>=1.26.0",
  "PyAudioWPatch>=0.2.12.8",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]
audio = [
  "PyAudioWPatch>=0.2.12.8",
]
asr = [
  "faster-whisper>=1.2.1",
]
translate = [
  "deep-translator>=1.11.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
